name: Pytest

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest   # runner necesario por GitHub Actions
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python (última 3.x)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r pytest-fixtures-examples/requirements.txt

      - name: Ejecutar pytest
        run: pytest -q pytest-fixtures-examples
